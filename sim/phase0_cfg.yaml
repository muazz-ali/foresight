# Foresight Phase 0 — Franka-only in-repo scene.
camera:
  clip:
    far: 100.0
    near: 0.01
  data_types:
  - rgb
  focal_length: 2.3
  focus_distance: 400.0
  fps: 25
  height: 360
  horizontal_aperture: 4.6
  width: 480
  # Wrist RGB on panda_hand (offset m, quat wxyz, near/far m).
  wrist_pos: [0.065, 0.0, 0.0]
  wrist_quat_wxyz: [0.0, 0.7071068, 0.7071068, 0.0]
  wrist_clipping_range: [0.01, 2.0]
robot:
  name: franka
  # TCP offset from panda_hand (Isaac Lab Franka DiffIK default)
  tcp_offset: [0.0, 0.0, 0.107]
  gripper_open: 0.04
  gripper_close: 0.0
  # EE pose: pos(3) + quat wxyz(4). Place XY/Z come from the container.
  init_pose: [0.45, 0.0, 0.40, 0.0, 1.0, 0.0, 0.0]
  max_reach_dist: 0.85
scene:
  table_height: 0.0
  table_size: [1.0, 1.0, 0.02]
  table_pos: [0.50, 0.0, -0.01]
  object_mass: 0.05
  object_friction: 2.0
  # Household USDs from paths.object_dir (DynamicVLA asset tree). true = sphere G0 debug.
  use_primitive: false
  object_radius: 0.03 # sphere radius when use_primitive is true
  container_mass: 0.1
  n_containers: 1
  place_hover_above_container: 0.08
  spawn_xy_pad: 0.03 # inset object spawn from bounce walls (m)
  container_jitter_xy: 0.02 # per-episode container XY jitter (m)
  container_xy_clip: [[0.45, 0.58], [0.26, 0.34]] # clip jitter so bowl stays off play band
  attach_z_offset_max: -0.005 # weld object at most this far below EE (m)
  # Object bounce box: in front of Franka, clear of base (~origin) and bowl (+Y).
  object_xy_bounds: [[0.48, 0.72], [-0.20, 0.10]]
  # Reachable side pocket (~0.58 m from base); robot drops here without crowding play.
  container_xy: [0.50, 0.30]
  object_categories:
  - apple
  - avocado
  # - beer
  # - bottle
  # - can
  # - cup
  - egg
  - kiwi
  - lemon
  - lime
  - onion
  - orange
  - peach
  - potato
  - tangerine
  - tomato
  container_categories:
  - bowl
  - box
  - plate
  # - placemat
  - tray
  cameras:
  # Third-person RGB (primary tracking view). Wrist cam uses camera.wrist_*.
  - name: static_cam
    position: [1.0, 0.0, 0.60]
    rotation_deg: [0.0, 60.0, 90.0]

    
state_machine_params:
  lookahead_s: 0.25 # robot arm lookahead time
  conditioning_delta_s: 0.25 # policy live-pack Δ (s); separate from aiming
  hover_z: 0.08 # meters above object top at the start of intercept
  ee_settle_tol: 0.05 # treat speed below this as still (m/s)
  servo_xy_tol: 0.03 # XY servo gate for carry/lower/home (m)
  place_xy_tol: 0.12 # container XY gate only; match success container_xy_tol (m)
  approach_z_tol: 0.03 # max Z error (m) for servo height gates
  home_z_tol: 0.05 # max Z error (m) to count the arm as home (IK sits ~2–5 cm off init Z)
  settle_s: 0.2 # seconds at start before intercept begins
  close_gripper_s: 0.15 # seconds fingers stay closed before we lift / open before home
  lift_height: 0.12 # meters to raise the hand after a good close
  drop_z_gap: 0.04 # extra height above object rest pose inside the box (m)
  drop_rim_clear_m: 0.01 # drop Z stays this far below container rim (m)
  inference_window_s: 10 # max seconds per demo run; timeout = failure
  # intercept-servo knobs
  servo_lag_s: 0.16 # EE command->motion lag (s). CALIBRATE with tools/diag/calibrate_servo_lag.py
  ee_speed_max: 0.90 # usable TCP speed (m/s) for the rendezvous solve. MEASURE, do not guess
  intercept_iters: 3 # fixed-point steps for the travel-time solve
  track_xy_tol: 0.02 # XY error to the object *now* that counts as "riding it" (m)
  track_hold_s: 0.08 # must stay locked this long before committing to descend (s)
  bounce_guard_s: 0.10 # floor on straight-line time before a wall reversal (s)
  z_release_radius: 0.12 # XY error (m) at which the hand starts walking Z down onto the object
  grasp_tol_step_k: 0.6 # grasp gate floor = k * speed * dt (one step of object travel)
  grasp_xy_tol: 0.02 # base XY grasp gate (m); floors up with speed
  grasp_z_tol: 0.02 # base Z grasp gate (m)
  stage_timeout_s: 1.5 # per-stage stall cap (s) for post-grasp stages
  grasp_stage_timeout_s: 3.0 # longer cap for intercept/descend (needs bounce windows)
  max_retries: 3 # re-intercept attempts before giving up

paths:
  object_dir: /home/gpuadmin/Desktop/muazzam/objects
  scene_dir: /home/gpuadmin/Desktop/muazzam/scenes
sim:
  dt: 0.04
  device: cuda:0
