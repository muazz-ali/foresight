# Foresight Phase 0 — Franka-only in-repo scene.
#
# Units: mm, ms, cm/s. load_cfg / load_yaml convert to m / s / m/s.
#
#   static_camera / wrist_camera / lighting → cameras + lights
#   robot                 → arm + fingers
#   scene                 → table / throw / meshes
#   state_machine_params  → expert stages (0 → done) + one policy look-ahead
#   paths / sim           → asset folders + control / physics rate

# =============================================================================
# STATIC CAMERA — fixed RGB (log / policy key: static_cam)
# =============================================================================
static_camera:
  width: 480
  height: 360
  # Label for videos/logs only — NOT passed to Isaac CameraCfg.
  # Real capture rate = sim.dt (cam.update once per control step; update_period=0).
  fps: 30                 # keep equal to 1000/dt_ms (30 Hz)
  focal_length: 2.3
  focus_distance: 400.0
  horizontal_aperture: 4.6
  data_types:
  - rgb
  - depth                 # claim dual-cam Z fuse (with wrist RGB-D)
  clip:
    near_mm: 10.0
    far_mm: 100000.0
  # X=1.2 m back; Z=0.70 m @ 45° tilt (was 0.80 m @ 48°). Far-rim throws
  # (~0.75–1.5 m) must stay in frame — smoke-check FOV after pose changes.
  position_mm: [1000.0, 0.0, 700.0]
  rotation_deg: [0.0, 50.0, 90.0]

# =============================================================================
# WRIST CAMERA — RGB-D on panda_hand (log / policy key: wrist_cam)
# =============================================================================
wrist_camera:
  width: 480
  height: 360
  fps: 30                 # label only; same as static_camera.fps
  focal_length: 2.3
  focus_distance: 400.0
  horizontal_aperture: 4.6
  data_types:
  - rgb
  - depth                 # Isaac Lab distance_to_image_plane (m)
  pos_mm: [65.0, 0.0, 0.0]
  quat_wxyz: [0.0, 0.7071068, 0.7071068, 0.0]
  clipping_range_mm: [10.0, 2000.0]

# =============================================================================
# ROBOT — Franka
# =============================================================================
robot:
  name: franka
  # Pad midpoint (URDF pinch Z=103.4 mm), not the old DiffIK TCP 107 mm.
  # Aim / ee_pos / closed_above all use this frame so Z targets the pinch.
  tcp_offset_mm: [0.0, 0.0, 103.4]
  gripper_open_mm: 40.0
  gripper_close_mm: 0.0
  init_pose_mm: [450.0, 0.0, 400.0, 0.0, 1.0, 0.0, 0.0]  # xyz + quat wxyz
  max_reach_dist_mm: 850.0
  # DiffIK velocity feedforward: v_cmd = v̂_obj + K·(p* − p_hand),
  # IK setpoint = p* + v̂_obj/K. Full lead every tick (near-field blend
  # removed — it made the hand hunt on a smooth aim).
  # K = 1/τ; τ≈190 ms from open-loop tip lag. 0 = off (absolute pose only).
  # Re-tune via tools/diag/probe_diffik_tracking.py.
  diffik_ff_gain: 5.26
  # Joint velocity feedforward (Oct 28). true → q̇* = J⁺·v̂ plus a per-substep
  # q* ramp; diffik_ff_gain is then ignored. Drive is position-only otherwise,
  # so damping brakes moving joints (lag d/k = 200 ms) and the per-tick hold
  # costs dt/2 more. Pure tracking at 30 cm/s: −7.9 mm (false) → +0.2 mm (true).
  joint_velocity_ff: true
  # Arm joint PD (HIGH_PD defaults: stiffness 400, damping 80). Damping 160
  # made s1003 trail worse; hunt was FF near-blend, not underdamped joints.
  arm_joint_stiffness: 400.0
  arm_joint_damping: 80.0
  # Finger travel time (SPEC-DERIVED from Franka Hand: 50 mm/s, 5 mm travel,
  # 30 ms cmd + 50 ms force → 180 ms nominal). Re-check on the real Hand.
  # Expert dwell = hold_closed_* below. Do NOT use the old sim value of 80 ms.
  gripper_close_time_ms: 180
  # Physical close model (B1). When enabled, fingers rate-limit instead of snap.
  gripper_actuator:
    enabled: true
    v_finger_mm_s: 50.0
    t_cmd_ms: 30.0
    t_force_ms: 50.0

# =============================================================================
# SCENE — house USD + throw + meshes
# =============================================================================
scene:
  # Physics fingers (no weld). Catchable throws + chase guards handle speed.
  # use_weld_grasp: true
  object_mass: 0.05
  object_friction: 2.0
  use_primitive: false              # true = debug sphere
  object_radius_mm: 30.0            # only if use_primitive
  container_mass: 0.1
  n_containers: 1
  place_hover_above_container_mm: 80.0
  spawn_xy_pad_mm: 30.0             # inset spawn from play-band edge
  container_jitter_xy_mm: 20.0
  # Throw fan at far +X edge: 0 = 90° straight at robot; 1 = uniform over full 180°.
  throw_randomness: 1.0
  # Tip-on-side for rolling. OFF for physics-grasp expert: tipped cans leave
  # z_grasp ~3 cm but DiffIK stalls with ee_z≈6 cm (XY in gate, Z never),
  # so the hand never closes and the throw coasts off (fast-smoke 4/4 tipped
  # cans = timeout/off-table; upright at 50 cm/s was 5/5). Re-enable when a
  # side-grasp / higher tip aim exists.
  tip_roll_categories: []
  # Bowl seed (mm). Layout: X −3 cm from seed, Y = real +Y table rim.
  container_xy_clip_mm: [[300.0, 400.0], [410.0, 450.0]]  # seed; layout overwrites
  attach_z_offset_max_mm: -5.0      # weld only: object at most this far below EE
  object_xy_bounds_mm: [[480.0, 720.0], [-200.0, 100.0]]  # seed; layout overwrites
  container_xy_mm: [350.0, 420.0]   # X seed (layout does −3 cm); Y → +Y rim

  exclude_usd_containers:
  - plate
  - tray
  - placemat
  exclude_usd_objects:
  - tomato   # tiny meshes slip under physics grasp (smoke tomato07 lift-stall)
  - beer     # tall / tip-prone; orientation out of scope
  - bottle
  - cup
  - can      # tip/yaw out of scope; upright cans still hard for physics
  - potato   # tipped wedges wedge in the 80 mm gripper
  # Drop wide meshes (Franka open ≈ 80 mm). Gate on collision XY ≤ 70 mm.
  # Ride-contact: ~70 mm apples leave ~0 mm/side after pads — expect marginal
  # scrape; do not tighten further (empties the apple catalog). Fix = Z floor
  # below + exclude empty cats, not a harder width gate.
  max_object_width_mm: 70.0
  # Expert aim Z never below table + this (stops tip-through-table dives).
  min_aim_z_above_table_mm: 15.0
  min_container_clearance_mm: 10.0   # box taller than object by this (closed tops)
  min_container_xy_margin_mm: 10.0   # container footprint bigger than object
  # Fingers open along world Y: container Y side ≥ object width + this
  # (two finger pads + place error). 122 mm boxes then take objects ≤ 62 mm.
  min_container_finger_clearance_mm: 60.0
  # Open tops: XY fit only (fruit may stick above the rim). Not plates/trays.
  open_container_categories:
  - bowl
  robot_base_keepout_mm: 120.0       # coast through pedestal → safety-abort
  ee_table_margin_mm: 20.0           # hand past table footprint → safety-abort

  # Keep in sync with OBJECTS in scripts/launch_p1_collect.sh.
  # No can/cup/beer/bottle (excluded above); fruit-sized only.
  # Claim scope (Oct 29): low fruit only. Tall fruit (apple, avocado, orange,
  # peach, tangerine; half-height ≥ ~35 mm) touch the gripper underside during
  # the ride (hand pushed up 5–8 mm, trail −1…−4 mm; C30 v5). Out of scope for
  # the timing claim — see foresight_plan.md "Claim scope".
  object_categories:
  - egg
  - kiwi
  - lemon
  - lime
  - onion
  # Spawn filter: re-draw a throw whose planned ride brings the wrist (joint 7)
  # within this margin of its ±2.897 rad limit (sim/ride_ik_check.py; predictor
  # error vs logged j7 ~0.3 rad sd). Re-draws are logged per episode.
  spawn_j7_margin_rad: 0.3
  spawn_max_redraws: 20

  # Held-out `unseen` / excluded cats only via --object-usd.
  container_categories:
  - bowl
  - box

# =============================================================================
# LIGHTING — behind / above static_camera
# =============================================================================
lighting:
  temperature: [4000, 8000]
  intensity: [150, 750]
  behind_mm: [3000.0, 12000.0]
  above_mm: [2000.0, 15000.0]
  side_mm: [-2000.0, 2000.0]

# =============================================================================
# EXPERT — knobs in stage order (0 → done)
# =============================================================================
state_machine_params:

  # Policy pack only (not used for aiming). Often same as max_aim_ahead_ms.
  policy_look_ahead_ms: 250

  # --- stage 0: start ---
  # Short wait: at 50 cm/s, 200 ms burns 10 cm of runway before the chase starts.
  wait_at_home_ms: 50

  # --- stage 1: intercept → close (stage 2 go-down unused) ---
  # Hand faster than objects up to ~1 m/s (meet-time + DiffIK chase). Aim cap
  # 400 ms so a 50 cm/s throw is led ~20 cm when far. DiffIK FF owns tip lag;
  # tip_lag_pad stays 0 (do not double-lead). Chase leftover → raise
  # robot.diffik_ff_gain's τ, not this pad.
  max_aim_ahead_ms: 400
  # Aim farther for tip lag (not a wait). Measure: tools/diag/probe_diffik_tracking.py.
  tip_lag_pad_ms: 0
  # Chase planning speed. Measured far-chase average is 0.365 m/s (C30 v5), but
  # planning with it puts the aim ~0.8× the gap ahead: the hand approaches from
  # in front and never enters the ride box (stage A, aa7346d: 0/25, 19
  # unreachable). 250 → 25/25 first-attempt on the same seeds.
  hand_speed_max_cm_s: 250.0
  aim_refine_iters: 3
  # Chase near-box: |dx|,|dy|,|dz| (mm). Inside → settle aim (object + 1 tick).
  # Close only when XY also ≤ close_xy_ok (B5: mean |d| ≤ 2 mm).
  # Z tight for physics grasp (17–20 mm high on cans glances then slips).
  grasp_xyz_ok_mm: [10.0, 10.0, 12.0]
  close_xy_ok_mm: 2.0
  # Soft ride pull toward object_now while outside the 2 mm close box.
  # Inside the box the aim is object_now (no pull, no hold).
  # 0.35 left s1001 parked at |dx|≈2.13 mm; 0.55 closes that last mm.
  ride_correction_gain: 0.55
  # Turn the hand about Z so the pads close ACROSS the object's path (fingers
  # either side of it). "fixed" kept fingers along world Y: +Y diagonal throws
  # ran the egg into a pad (5 mm clearance) and the contact kicked the ride
  # 5–10 cm/s per tick (C1_grid_v2 C30 s1003/05/07/08). E6: 55 → 78 % at 30 cm/s.
  grasp_yaw_mode: along
  # Reach stop: the arm cannot work inside this radius around the robot base
  # (XY, grasp height). If the object's straight path enters it within
  # reach_stop_mm and the hand has not started closing, stop the chase and go
  # home (no elbow jam). 200 mm: smooth-ride C30 grasps still succeed down to
  # ~27 cm with the hand at 23 cm; 270 mm (elbow line) cancelled 4/10 of them.
  reach_zone_radius_mm: 200.0
  reach_stop_mm: 100.0
  # Predictive close (Fix1 closeout): |e + Δv·t_contact| ≤ close_xy_ok and
  # |Δv| ≤ 1.39 cm/s. t_contact ≈ 130 ms from the actuator model. Keep ticks=1.
  close_settle_ticks: 1

  # --- stage 3: close ---
  # Dwell after close (not finger travel = robot.gripper_close_time_ms).
  hold_closed_weld_ms: 100
  hold_closed_physics_ms: 300
  use_reflex: false
  # 0 = off: close gate uses GT |dz|. >0 replaces the Z check with wrist depth (real arm).
  wrist_close_depth_mm: 0.0

  # --- stages 4–7: lift / carry / lower / open ---
  lift_height_mm: 120.0
  slip_if_farther_mm: 100.0
  near_enough_xy_mm: 30.0           # carry / lower / home XY
  arrived_z_ok_mm: 30.0             # carry / lower / lift height arrival (not grasp)
  drop_above_rest_mm: 40.0
  drop_below_rim_mm: 10.0
  in_box_xy_ok_mm: 120.0

  # --- stage 8: home ---
  home_z_ok_mm: 50.0
  # Physics grasp does not pin the placed object: rise straight up this far
  # (XY held) before heading home, leading Z by release_step_mm per tick.
  release_retreat_mm: 100.0
  release_step_mm: 20.0

  # --- budgets ---
  # Whole-demo ceiling. Throw miss stops earlier via off_table. Do not set ~1000.
  episode_max_ms: 10000
  stall_timeout_ms: 1500
  chase_stall_timeout_ms: 3000
  max_retries: 3

# =============================================================================
# PATHS + SIM CLOCK
# =============================================================================
paths:
  object_dir: /home/gpuadmin/Desktop/muazzam/objects
  scene_dir: /home/gpuadmin/Desktop/muazzam/scenes

# =============================================================================
# CLAIM TIMING — Step 1 (30 Hz loop + delay injection)
# =============================================================================
# Applied Δ = real wait before motions from a frame at t0 run (t0 + applied).
# Reported Δ = what forecast/policy see (applied + ~10 ms jitter).
claim_timing:
  enabled: true
  # Reported − applied ~ N(0, 10 ms). Step-1 check: std ≈ 10 ms over 1000 cycles.
  delta_jitter_ms: 10.0
  # Train: draw applied each cycle. Eval: fix via eval_delta_ms or DelayInjection.set_eval_delta.
  train_delta_min_ms: 0.0
  train_delta_max_ms: 200.0
  eval_delta_ms: 0.0
  # Hold expert motion until apply_at = t0 + applied_Δ (opt-in; default off
  # until delay-hold is proven not to kill expert success).
  enforce_apply_at: false
  # Pack conditioning from noisy_gt filter instead of clean GT (optional).
  use_noisy_gt: false
  # B3: expert enters CLOSE only when |v_hand−v_obj|_xy × t_close ≤ 2.5 mm
  # (at t_close=180 ms → max_dv ≈ 1.39 cm/s) and XY ≤ close_xy_ok.
  close_speed_guard: true
  close_speed_slack_mm: 2.5
  # B1 oracle: frame-delay buffer for expert (Δ = obs age, not enforce_apply_at).
  obs_delay_buffer: false
  # B1: Δ_meas = Δ_true + η, η ~ N(0, 5 ms), redrawn once per replan cycle.
  delta_meas_noise_ms: 5.0
  delta_meas_replan_ms: 330.0
  # Pre-shape: w_pre = w_obj + 2×s along finger axis; s in mm; clamp at open gap.
  pre_shape_slack_mm: 5.0
  pre_shape_max_open_mm: 80.0

# Grasp height: expert aims object centre; policy pack p̂z from wrist depth.
# Wrist depth only trusted while hand–top gap ≥ 7 cm (D405 bad closer in).
claim_height:
  close_at_object_center: true   # expert aim Z = obj centre (reliable demos)
  pack_z_from_depth: true        # training pack p̂z from wrist depth latch (not GT)
  # g: insert past top when building z_grasp from a measured top.
  finger_insert_mm: 30.0
  table_clear_mm: 5.0          # c: fingertips stay this far above the table
  z_slack_mm: 5.0              # s_z: vertical slack; close gate uses s_z/2
  latch_lo_mm: 70.0            # lock when gap < 7 cm (stop trusting new depth)
  latch_hi_mm: 200.0           # collect continuously while gap ≥ 20 cm
  depth_percentile: 90.0       # wrist depth: high percentile of object pixels
  # Added onto the wrist z_top. 0: the point-cloud top (grasp_height.z_top_from_wrist_cloud)
  # reads −0.6 mm on still objects (A4); the old window estimator needed +6.7.
  depth_z_bias_mm: 0.0
  # Gate: wrist z_top RMSE vs GT must stay ≤ this (sim check / diag).
  depth_rmse_max_mm: 10.0

sim:
  dt_ms: 33.333333                  # control / cameras / logs = 30 Hz
  # House only: physics steps per control step (4 → 120 Hz). Floor always 1.
  physics_substeps: 4
  device: cuda:0
