scene:
  cameras:
  - name: opst_cam
    position:
    - 1
    - 0
    - 0.6
    prim_path: /Robot/OppositeCamera
    rotation:
    - 0
    - 60
    - 90
  - name: side_cam
    position:
    - 0.5
    - 1
    - 0.35
    prim_path: /Robot/SideCamera
    rotation:
    - -90
    - 0
    - 180
  containers:
    categories:
    - bowl
    - box
    - plate
    - placemat
    - tray
    mass: 0.1
    n_containers: 1
  objects:
    categories:
    - cup
    - can
    - apple
    - orange
    - tomato
    force_static: false
    friction:
    - 1.5
    - 2.5
    mass: 0.05
    moving_speed:
    - 0.1
    - 0.1
    n_objects: 1
    perturbation: null
    prob_rnd_quat: 0.2
    prob_static: 0.0
    tag_thresholds:
      area: 0.1
      distance_from_robot: 0.2
      height: 0.1
      position_from_bottom: 0.1
      position_from_left: 0.1
      velocity: 0.2
      volume: 0.1
tasks:
  long-horizon:
    episode_length: 20
    sm: state_machines.place_sm.PlaceStateMachine
  pick:
    episode_length: 10
    sm: state_machines.pick_sm.PickStateMachine
  place:
