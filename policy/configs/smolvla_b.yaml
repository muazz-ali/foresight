# Model B = Model A + 4 live future numbers (XY p̂/v̂).
# Loaded by policy/train_smolvla.py (--policy-cfg). Keep delta_min == delta_max
# while Δ is not packed; value must match sim/phase0_cfg.yaml conditioning_delta_s.
model: B
repo_id: foresight/p1
dataset_root: null  # set at CLI
pretrained: lerobot/smolvla_base
steps: 20000
batch_size: 8
lr: 1.0e-4
delta_min: 0.25
delta_max: 0.25
pos_noise_std: 0.015  # ~1.5 cm
vel_noise_std: 0.03   # ~3 cm/s
