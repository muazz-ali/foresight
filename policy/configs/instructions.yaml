# Task text for SmolVLA. Many wordings per object so the model cannot
# memorize one sentence. Every line still names the object (apple ≠ tangerine)
# and the container, so the words and the picture have to agree.
#
# Used by policy.features.default_language and paraphrase_task.
# Keys = object category stems. Unknown objects use `default`.

templates:
  apple:
    - "Pick the apple and place it in the {container}."
    - "Pick the red apple and put it in the {container}."
    - "Grasp the apple and place it into the {container}."
    - "Grab the apple and set it in the {container}."
    - "Take the red apple and drop it in the {container}."
    - "Lift the apple and put it into the {container}."
  tangerine:
    - "Pick the tangerine and place it in the {container}."
    - "Pick the orange tangerine and put it in the {container}."
    - "Grasp the tangerine and place it into the {container}."
    - "Grab the tangerine and set it in the {container}."
    - "Take the tangerine and drop it in the {container}."
    - "Lift the small tangerine and put it into the {container}."
  orange:
